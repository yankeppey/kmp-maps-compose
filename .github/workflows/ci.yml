name: CI

# Builds every branch and publishes per-commit snapshots from the ones that own a -SNAPSHOT
# coordinate: dev, and release/* until its final bump. Releases are cut from tags by
# release.yml; PRs build but never publish.
on:
  pull_request:
    branches: [dev, main, 'release/**']
  push:
    branches: [dev, main, 'release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build All Platforms
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      # Snapshots go to Central's snapshot repository, which takes the same Portal token as
      # a release. No signing key here on purpose: vanniktech only requires signatures for
      # non-SNAPSHOT versions, and a fork PR cannot read secrets at all.
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Android AAR + iOS klibs and frameworks for both published modules. `assemble` on a
      # macOS host covers every target the library ships.
      - name: Assemble library
        run: >
          ./gradlew
          :kmp-maps-compose:assemble
          :kmp-maps-compose-utils:assemble
          --stacktrace

      # The sample is the only consumer in the repo, so it is what catches an API change that
      # compiles in isolation but breaks callers.
      - name: Build sample apps
        run: >
          ./gradlew
          :sample:androidApp:assembleDebug
          :sample:shared:linkDebugFrameworkIosSimulatorArm64
          --stacktrace

      # publishSafe keeps the build machine out of `linkerOpts`, the only manifest options a
      # consumer's linker reads. `libraryPaths` and the `compilerOpts` headers stay absolute by
      # design, so only linkerOpts is checked. See issue #10.
      - name: Check klibs carry no build-machine paths
        run: |
          set -euo pipefail
          leaked=0
          while IFS= read -r manifest; do
            if grep -qE '^linkerOpts=.*(/Users/runner|/Applications/Xcode)' "$manifest"; then
              echo "::error file=$manifest::klib linkerOpts contains build-machine paths"
              grep -nE '^linkerOpts=' "$manifest"
              leaked=1
            fi
          done < <(find . -path '*/main/cinterop/*/default/manifest' -not -path './.git/*')
          exit $leaked

      # Publish gate: dev always; release/* only while still -SNAPSHOT (once it pins the final
      # version, that coordinate belongs to the tag). PRs and main never publish.
      - name: Determine snapshot-publish gate
        id: gate
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          ref="${{ github.ref }}"
          is_snapshot=false
          if grep -qE '^kmp-maps-compose[[:space:]]*=[[:space:]]*"[^"]*-SNAPSHOT"' gradle/libs.versions.toml; then
            is_snapshot=true
          fi
          publish=false
          case "$ref" in
            refs/heads/dev) [ "$is_snapshot" = true ] && publish=true ;;
            refs/heads/release/*) [ "$is_snapshot" = true ] && publish=true ;;
          esac
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "gate: ref=$ref is_snapshot=$is_snapshot -> publish=$publish"

      # Both modules in one invocation so they land as one snapshot set.
      - name: Publish SNAPSHOT to Maven Central
        if: steps.gate.outputs.publish == 'true'
        run: >
          ./gradlew
          :kmp-maps-compose:publishToMavenCentral
          :kmp-maps-compose-utils:publishToMavenCentral
          --no-configuration-cache --stacktrace

      - name: Summary
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          V=$(awk -F'"' '/^kmp-maps-compose[[:space:]]*=[[:space:]]*"/{print $2; exit}' gradle/libs.versions.toml)
          echo "### Published \`$V\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- eu.buney.maps:{kmp-maps-compose,kmp-maps-compose-utils} -> https://central.sonatype.com/repository/maven-snapshots/" >> "$GITHUB_STEP_SUMMARY"

name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to Maven Central'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build All Platforms
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build and Publish to Maven Local
        run: ./gradlew publishToMavenLocal --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      # publishSafe keeps the build machine out of `linkerOpts`, the only manifest options a
      # consumer's linker reads. `libraryPaths` and the `compilerOpts` headers stay absolute by
      # design, so only linkerOpts is checked. See issue #10.
      - name: Check klibs carry no build-machine paths
        run: |
          set -euo pipefail
          leaked=0
          while IFS= read -r klib; do
            linkerOpts=$(unzip -p "$klib" default/manifest | grep '^linkerOpts=' || true)
            if grep -qE '(/Users/runner|/Applications/Xcode)' <<<"$linkerOpts"; then
              echo "::error file=$klib::klib linkerOpts contains build-machine paths"
              grep -nE '(/Users/runner|/Applications/Xcode)' <<<"$linkerOpts"
              leaked=1
            fi
          done < <(find ~/.m2/repository/eu/buney/maps -iname '*cinterop*.klib')
          exit $leaked

      - name: Publish to Maven Central
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
